name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: for f in extension.js media/*.js dev/*.js; do node --check "$f"; done

      - name: Core tests
        run: npm test

      - name: Translation check
        run: npm run check-l10n

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: prism-csv-vsix
          path: '*.vsix'
